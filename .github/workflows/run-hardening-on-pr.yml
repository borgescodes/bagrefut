name: Run operational hardening on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'fix/operational-automation-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operational-automation-hardening
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Extract and run hardening generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/harden-operational-automation.yml').read_text()
          start = source.index("          python3 <<'PY'\n") + len("          python3 <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''operational = replace_once(
    operational,
    """        result = jsonb_build_object(
          'error', SQLERRM,
          'attempt_count', _attempt
        )""",
    """        result = coalesce(result, '{}'::jsonb) || jsonb_build_object(
          'last_failure', jsonb_build_object(
            'error', SQLERRM,
            'attempt_count', _attempt,
            'failed_at', pg_catalog.now()
          ),
          'attempt_count', _attempt
        )""",
    'preserve failure history'
)
'''
          new = '''failure_pattern = re.compile(
    r"result\\s*=\\s*jsonb_build_object\\(\\s*'error',\\s*SQLERRM,\\s*'attempt_count',\\s*_attempt\\s*\\)",
    re.MULTILINE,
)
operational, failure_count = failure_pattern.subn(
    """result = coalesce(result, '{}'::jsonb) || jsonb_build_object(
          'last_failure', jsonb_build_object(
            'error', SQLERRM,
            'attempt_count', _attempt,
            'failed_at', pg_catalog.now()
          ),
          'attempt_count', _attempt
        )""",
    operational,
    count=1,
)
if failure_count != 1:
    raise RuntimeError(f'preserve failure history: expected one occurrence, found {failure_count}')
'''
          if old not in script:
              raise RuntimeError('generator failure-history block not found')
          script = script.replace(old, new, 1)
          Path('/tmp/harden.py').write_text(script)
          PY
          if ! python3 /tmp/harden.py > /tmp/harden.log 2>&1; then
            cat /tmp/harden.log
            exit 1
          fi
          rm -f .github/workflows/harden-operational-automation.yml
          rm -f .github/workflows/run-hardening-on-pr.yml
          rm -f .github/workflows/debug-hardening.yml
      - name: Run checks
        run: |
          bun install --frozen-lockfile
          bun run check
          git diff --check
      - name: Commit hardened implementation
        shell: bash
        run: |
          git restore src/routeTree.gen.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: endurecer automacao operacional"
          git push origin HEAD:fix/operational-automation-hardening
