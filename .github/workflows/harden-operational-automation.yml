name: Harden operational automation

on:
  push:
    branches:
      - fix/operational-automation-hardening
    paths:
      - .github/workflows/harden-operational-automation.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operational-automation-hardening
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate deterministic SQL and strengthen contract test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          match_path = root / 'supabase/migrations/20260709140000_match_simulation.sql'
          season_path = root / 'supabase/migrations/20260709101000_season_engine.sql'
          op_path = root / 'supabase/migrations/20260709170000_operational_automation.sql'
          test_path = root / 'supabase/tests/database/operational_automation.sql'
          workflow_path = root / '.github/workflows/harden-operational-automation.yml'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          def extract_function(text: str, start_marker: str) -> str:
              start = text.index(start_marker)
              end = text.index('\n$$;', start) + len('\n$$;')
              return text[start:end]

          def remove_audit(function_sql: str, action: str, return_marker: str) -> str:
              start_marker = (
                  "\n  INSERT INTO public.admin_audit_logs(admin_id, action, target_table, target_id, payload)\n"
                  "  VALUES (\n"
                  "    _admin_id,\n"
                  f"    '{action}',"
              )
              start = function_sql.index(start_marker)
              end = function_sql.index(return_marker, start)
              return function_sql[:start] + function_sql[end:]

          match_source = match_path.read_text(encoding='utf-8')
          season_source = season_path.read_text(encoding='utf-8')
          operational = op_path.read_text(encoding='utf-8')
          contract = test_path.read_text(encoding='utf-8')

          match_core = extract_function(
              match_source,
              'CREATE OR REPLACE FUNCTION public.simulate_match(_match_id uuid)'
          )
          match_core = replace_once(
              match_core,
              'CREATE OR REPLACE FUNCTION public.simulate_match(_match_id uuid)',
              'CREATE OR REPLACE FUNCTION public._match_simulate_internal(_match_id uuid)',
              'rename match core'
          )
          match_core = replace_once(
              match_core,
              '  _admin_id uuid := public._assert_approved_admin();\n',
              '',
              'remove match admin declaration'
          )
          processed_block = """
  IF NOT EXISTS (
    SELECT 1
    FROM public.matches pending
    WHERE pending.round_id = _round.id
      AND pending.status <> 'finished'::public.match_status
  ) THEN
    UPDATE public.rounds
    SET is_processed = true
    WHERE id = _round.id;
  END IF;
"""
          match_core = replace_once(
              match_core,
              processed_block,
              '\n',
              'remove match round processing'
          )
          match_core = remove_audit(
              match_core,
              'simulate_match',
              '\n\n  RETURN public._match_result_json(_match.id);'
          )

          round_core = extract_function(
              match_source,
              'CREATE OR REPLACE FUNCTION public.simulate_round(_round_id uuid)'
          )
          round_core = replace_once(
              round_core,
              'CREATE OR REPLACE FUNCTION public.simulate_round(_round_id uuid)',
              'CREATE OR REPLACE FUNCTION public._round_simulate_internal(_round_id uuid)',
              'rename round core'
          )
          round_core = replace_once(
              round_core,
              '  _admin_id uuid := public._assert_approved_admin();\n',
              '',
              'remove round admin declaration'
          )
          round_core = replace_once(
              round_core,
              'SELECT public.simulate_match(_match.id) INTO _result;',
              'SELECT public._match_simulate_internal(_match.id) INTO _result;',
              'route round through internal match core'
          )
          round_core = replace_once(
              round_core,
              processed_block,
              '\n',
              'remove round processing flag'
          )
          round_core = replace_once(
              round_core,
              '\n  FOR _match IN\n',
              "\n  UPDATE public.rounds\n"
              "  SET simulation_started_at = coalesce(simulation_started_at, pg_catalog.now())\n"
              "  WHERE id = _round.id;\n\n"
              "  FOR _match IN\n",
              'record simulation start'
          )
          round_core = remove_audit(
              round_core,
              'simulate_round',
              '\n\n  RETURN jsonb_build_object('
          )

          season_core = extract_function(
              season_source,
              'CREATE OR REPLACE FUNCTION public.season_finish(_season_id uuid DEFAULT NULL)'
          )
          season_core = replace_once(
              season_core,
              'CREATE OR REPLACE FUNCTION public.season_finish(_season_id uuid DEFAULT NULL)',
              'CREATE OR REPLACE FUNCTION public._season_finish_internal(_season_id uuid DEFAULT NULL)',
              'rename season core'
          )
          season_core = replace_once(
              season_core,
              '  _admin_id uuid := public._assert_approved_admin();\n',
              '',
              'remove season admin declaration'
          )
          season_core = replace_once(
              season_core,
              """  IF _season.id IS NULL OR _season.status <> 'active' THEN
    RAISE EXCEPTION 'season_not_active';
  END IF;""",
              """  IF _season.id IS NULL THEN
    RAISE EXCEPTION 'season_not_active';
  END IF;

  IF _season.status = 'finished' THEN
    RETURN jsonb_build_object(
      'season_id', _season.id,
      'champion_club_id', _season.champion_club_id,
      'champion_points', _season.champion_points,
      'champion_wins', _season.champion_wins,
      'champion_goal_difference', _season.champion_goal_difference,
      'idempotent', true
    );
  END IF;

  IF _season.status <> 'active' THEN
    RAISE EXCEPTION 'season_not_active';
  END IF;""",
              'make season core idempotent'
          )
          season_core = remove_audit(
              season_core,
              'season_finish',
              '\n\n  RETURN jsonb_build_object('
          )

          for name, core in (
              ('match', match_core),
              ('round', round_core),
              ('season', season_core),
          ):
              forbidden = ['auth.uid(', '_assert_approved_admin', 'admin_audit_logs']
              for token in forbidden:
                  if token in core:
                      raise RuntimeError(f'{name} core still contains {token}')
          if 'SET is_processed = true' in match_core or 'SET is_processed = true' in round_core:
              raise RuntimeError('simulation core still marks round processed')

          explicit_cores = f"""-- ---------- EXPLICIT INTERNAL CORES ----------
-- Definitions are copied explicitly from the versioned season/match engines.
-- No runtime introspection or generated function source is used.
{match_core}

{round_core}

{season_core}

REVOKE ALL ON FUNCTION public._match_simulate_internal(uuid) FROM PUBLIC, anon, authenticated;
REVOKE ALL ON FUNCTION public._round_simulate_internal(uuid) FROM PUBLIC, anon, authenticated;
REVOKE ALL ON FUNCTION public._season_finish_internal(uuid) FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public._match_simulate_internal(uuid) TO service_role, postgres;
GRANT EXECUTE ON FUNCTION public._round_simulate_internal(uuid) TO service_role, postgres;
GRANT EXECUTE ON FUNCTION public._season_finish_internal(uuid) TO service_role, postgres;

"""

          dynamic_start = operational.index('-- Build internal cores from the currently applied public functions')
          finalize_start = operational.index('CREATE OR REPLACE FUNCTION public._round_finalize_internal')
          operational = operational[:dynamic_start] + explicit_cores + operational[finalize_start:]

          operational = replace_once(
              operational,
              """  SELECT coalesce((result->>'manual_retry_count')::integer, 0) + 1
  INTO _manual_retry_count""",
              """  SELECT coalesce(
    jsonb_array_length(
      CASE
        WHEN jsonb_typeof(result->'manual_retries') = 'array' THEN result->'manual_retries'
        ELSE '[]'::jsonb
      END
    ),
    0
  ) + 1
  INTO _manual_retry_count""",
              'manual retry counter'
          )
          operational = replace_once(
              operational,
              """  SET status = 'pending',
      next_retry_at = NULL,
      started_at = NULL,
      finished_at = NULL,
      last_error = NULL,
      result = coalesce(result, '{}'::jsonb) || jsonb_build_object(
        'manual_retry_requested_at', pg_catalog.now(),
        'manual_retry_count', _manual_retry_count
      )""",
              """  SET status = 'pending',
      next_retry_at = pg_catalog.now(),
      started_at = NULL,
      finished_at = NULL,
      result = jsonb_set(
        coalesce(result, '{}'::jsonb),
        '{manual_retries}',
        (
          CASE
            WHEN jsonb_typeof(result->'manual_retries') = 'array' THEN result->'manual_retries'
            ELSE '[]'::jsonb
          END
        ) || jsonb_build_array(
          jsonb_build_object(
            'requested_at', pg_catalog.now(),
            'attempt_count', attempt_count,
            'previous_status', status,
            'previous_error', last_error
          )
        ),
        true
      ) || jsonb_build_object('manual_retry_count', _manual_retry_count)""",
              'preserve retry history'
          )
          operational = replace_once(
              operational,
              "result = coalesce(_result, '{}'::jsonb)",
              "result = coalesce(result, '{}'::jsonb) || jsonb_build_object(\n"
              "          'last_success', coalesce(_result, '{}'::jsonb),\n"
              "          'attempt_count', _attempt,\n"
              "          'succeeded_at', pg_catalog.now()\n"
              "        )",
              'preserve success history'
          )
          operational = replace_once(
              operational,
              """        result = jsonb_build_object(
          'error', SQLERRM,
          'attempt_count', _attempt
        )""",
              """        result = coalesce(result, '{}'::jsonb) || jsonb_build_object(
          'last_failure', jsonb_build_object(
            'error', SQLERRM,
            'attempt_count', _attempt,
            'failed_at', pg_catalog.now()
          ),
          'attempt_count', _attempt
        )""",
              'preserve failure history'
          )

          cron_marker = "DO $$\nBEGIN\n  BEGIN\n    CREATE EXTENSION IF NOT EXISTS pg_cron;"
          cron_start = operational.rfind(cron_marker)
          if cron_start < 0:
              raise RuntimeError('cron block not found')
          safe_cron = """DO $$
BEGIN
  BEGIN
    CREATE EXTENSION IF NOT EXISTS pg_cron;
  EXCEPTION WHEN OTHERS THEN
    RAISE NOTICE 'pg_cron unavailable (%); use POST /api/internal/jobs/process-due-rounds', SQLERRM;
  END;

  BEGIN
    IF pg_catalog.to_regclass('cron.job') IS NULL THEN
      RAISE NOTICE 'cron.job unavailable; operational DB functions remain active';
      RETURN;
    END IF;

    PERFORM cron.unschedule(jobid)
    FROM cron.job
    WHERE jobname = 'bagrefut-process-due-rounds';

    PERFORM cron.schedule(
      'bagrefut-process-due-rounds',
      '* * * * *',
      'SELECT public.process_due_rounds(now());'
    );
  EXCEPTION WHEN OTHERS THEN
    RAISE NOTICE 'pg_cron configuration skipped (%); operational DB functions remain active', SQLERRM;
  END;
END $$;
"""
          operational = operational[:cron_start] + safe_cron

          migration_forbidden = ['pg_get_functiondef(', 'regexp_replace(', 'EXECUTE _sql']
          for token in migration_forbidden:
              if token in operational:
                  raise RuntimeError(f'operational migration still contains {token}')
          for signature in (
              'public._match_simulate_internal(_match_id uuid)',
              'public._round_simulate_internal(_round_id uuid)',
              'public._round_finalize_internal(_round_id uuid)',
              'public._season_finish_internal(_season_id uuid DEFAULT NULL)',
          ):
              if signature not in operational:
                  raise RuntimeError(f'missing explicit function: {signature}')

          contract = replace_once(
              contract,
              """  _prize_count integer;
  _i integer;""",
              """  _prize_count integer;
  _audit_before integer;
  _audit_after integer;
  _match_id uuid;
  _player_id uuid;
  _card_id uuid;
  _definition text;
  _i integer;""",
              'extend test declarations'
          )
          contract = replace_once(
              contract,
              """  IF _badge_id IS NULL THEN RAISE EXCEPTION 'test_setup_failed: badge_missing'; END IF;

  CREATE TEMP TABLE""",
              """  IF _badge_id IS NULL THEN RAISE EXCEPTION 'test_setup_failed: badge_missing'; END IF;

  IF pg_catalog.to_regclass('public.operational_job_runs') IS NULL
     OR pg_catalog.to_regprocedure('public.process_due_rounds(timestamptz)') IS NULL THEN
    RAISE EXCEPTION 'assertion_failed: operational DB layer missing without dependency on pg_cron';
  END IF;

  SELECT pg_catalog.pg_get_functiondef('public._match_simulate_internal(uuid)'::regprocedure)
  INTO _definition;
  IF _definition LIKE '%auth.uid(%'
     OR _definition LIKE '%_assert_approved_admin%'
     OR _definition LIKE '%admin_audit_logs%'
     OR _definition LIKE '%SET is_processed = true%' THEN
    RAISE EXCEPTION 'assertion_failed: match core contains auth, audit, or round-finalize logic';
  END IF;

  SELECT pg_catalog.pg_get_functiondef('public._round_simulate_internal(uuid)'::regprocedure)
  INTO _definition;
  IF _definition LIKE '%auth.uid(%'
     OR _definition LIKE '%_assert_approved_admin%'
     OR _definition LIKE '%admin_audit_logs%'
     OR _definition LIKE '%SET is_processed = true%' THEN
    RAISE EXCEPTION 'assertion_failed: round core contains auth, audit, or round-finalize logic';
  END IF;

  SELECT pg_catalog.pg_get_functiondef('public._season_finish_internal(uuid)'::regprocedure)
  INTO _definition;
  IF _definition LIKE '%auth.uid(%'
     OR _definition LIKE '%_assert_approved_admin%'
     OR _definition LIKE '%admin_audit_logs%' THEN
    RAISE EXCEPTION 'assertion_failed: season core contains auth or audit logic';
  END IF;

  CREATE TEMP TABLE""",
              'add core and pg_cron-independent contracts'
          )
          contract = replace_once(
              contract,
              """  UPDATE public.profiles SET status = 'approved'::public.user_status WHERE id = ANY(_users);

  INSERT INTO public.seasons""",
              """  UPDATE public.profiles SET status = 'approved'::public.user_status WHERE id = ANY(_users);
  INSERT INTO public.user_roles(user_id, role)
  VALUES (_users[1], 'admin'::public.app_role);

  INSERT INTO public.seasons""",
              'create test admin'
          )
          contract = contract.replace("'GOL'::public.player_position", "'GK'::public.player_position")
          contract = contract.replace("'common'::public.player_rarity", "'paia'::public.player_rarity")
          contract = contract.replace("'base'::public.player_sector", "'centro'::public.player_sector")
          contract = replace_once(
              contract,
              """      RETURNING id INTO _round_id;

      INSERT INTO public.club_players(club_id, player_id, is_reserved)
      VALUES (_clubs[_i], _round_id, false);""",
              """      RETURNING id INTO _player_id;

      SELECT id INTO _card_id
      FROM public.club_players
      WHERE player_id = _player_id
      FOR UPDATE;

      DELETE FROM public.system_market_stock
      WHERE club_player_id = _card_id;

      UPDATE public.club_players
      SET club_id = _clubs[_i],
          is_reserved = false
      WHERE id = _card_id;""",
              'reuse permanent player cards'
          )
          contract = replace_once(
              contract,
              """  IF _count <> _reward_count THEN
    RAISE EXCEPTION 'assertion_failed: repeated simulation duplicated match rewards';
  END IF;

  IF (SELECT is_processed""",
              """  IF _count <> _reward_count THEN
    RAISE EXCEPTION 'assertion_failed: repeated simulation duplicated match rewards';
  END IF;

  SELECT id INTO _match_id
  FROM public.matches
  WHERE round_id = _round_ids[1]
  ORDER BY id
  LIMIT 1;

  SELECT pg_catalog.count(*) INTO _audit_before
  FROM public.admin_audit_logs
  WHERE action = 'simulate_match'
    AND target_id = _match_id;

  PERFORM pg_catalog.set_config('request.jwt.claim.sub', _users[1]::text, true);
  PERFORM public.simulate_match(_match_id);

  SELECT pg_catalog.count(*) INTO _audit_after
  FROM public.admin_audit_logs
  WHERE action = 'simulate_match'
    AND target_id = _match_id;

  IF _audit_after <> _audit_before + 1 THEN
    RAISE EXCEPTION 'assertion_failed: public wrapper must create exactly one audit log';
  END IF;

  IF (SELECT is_processed""",
              'assert wrapper audit'
          )
          contract = replace_once(
              contract,
              """  UPDATE public.operational_job_runs
  SET status = 'pending',
      next_retry_at = NULL
  WHERE id = _job.id;

  SELECT public.process_due_rounds""",
              """  SELECT public._operational_retry_job_run(_job.id) INTO _result;
  SELECT * INTO _job
  FROM public.operational_job_runs
  WHERE id = _job.id;

  IF _job.status <> 'pending'
     OR _job.next_retry_at IS NULL
     OR _job.attempt_count <> 5
     OR coalesce((_job.result->>'manual_retry_count')::integer, 0) <> 1
     OR jsonb_array_length(coalesce(_job.result->'manual_retries', '[]'::jsonb)) <> 1 THEN
    RAISE EXCEPTION 'assertion_failed: manual retry did not preserve history or schedule immediate retry';
  END IF;

  SELECT public.process_due_rounds""",
              'test manual retry history'
          )

          op_path.write_text(operational, encoding='utf-8')
          test_path.write_text(contract, encoding='utf-8')

          operations_doc = root / 'docs/OPERATIONS.md'
          if operations_doc.exists():
              doc = operations_doc.read_text(encoding='utf-8')
              note = """

## Contrato dos cores internos

Os cores `_match_simulate_internal`, `_round_simulate_internal`,
`_round_finalize_internal` e `_season_finish_internal` possuem definições SQL
explícitas na migration. A instalação não deriva código via catálogo PostgreSQL.
A ausência ou falha de configuração do `pg_cron` não reverte a camada operacional;
o endpoint interno permanece como scheduler alternativo.
"""
              if '## Contrato dos cores internos' not in doc:
                  operations_doc.write_text(doc.rstrip() + note, encoding='utf-8')

          workflow_path.unlink()
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository checks
        run: |
          bun run check
          git diff --check

      - name: Commit generated hardening
        shell: bash
        run: |
          git restore src/routeTree.gen.ts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: endurecer automacao operacional"
          git push origin HEAD:fix/operational-automation-hardening
